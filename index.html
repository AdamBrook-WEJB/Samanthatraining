<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Samantha's Plan">
<meta name="description" content="A gentle weekly training plan: kettlebells, Pilates and treadmill walks, with a water tracker and a bit of encouragement.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%23FFF7F3%27/%3E%3Ctext x=%2732%27 y=%2744%27 text-anchor=%27middle%27 font-family=%27Avenir Next,Segoe UI,sans-serif%27 font-weight=%27700%27 font-size=%2732%27 fill=%27%23D9648A%27%3ES%3C/text%3E%3C/svg%3E">
<title>Samantha's Training Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&family=Fraunces:ital,wght@1,400;1,600&display=swap">
<style>
/* Samantha's Training Plan
   Palette: blush ground, dusty rose / apricot / amber / sage accents, warm plum ink.
   Type: Quicksand (headings, rounded and soft) · Nunito Sans (body) · Fraunces italic (quotes only). */
:root {
  --bg: #FFF7F3;
  --surface: #FFFFFF;
  --surface-2: #FDEEE7;
  --surface-3: #FAE1D6;
  --line: #F3DAD0;
  --line-2: #E9C6B7;
  --ink: #5A3B44;
  --ink-soft: #8D6A70;
  --ink-faint: #B99AA0;
  --rose: #D9648A;
  --rose-deep: #B94569;
  --rose-soft: #FBDEE6;
  --apricot: #E8814B;
  --apricot-soft: #FCE0CE;
  --amber: #D99A35;
  --amber-soft: #FAE9CA;
  --sage: #6F9C86;
  --sage-soft: #DCEAE1;
  --on-accent: #FFFFFF;
  --shadow: 0 6px 20px rgba(185, 69, 105, 0.10);
  --shadow-lg: 0 14px 34px rgba(185, 69, 105, 0.16);
  --display: 'Quicksand', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --body: 'Nunito Sans', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --quote: 'Fraunces', Georgia, 'Times New Roman', serif;
  --r-xl: 26px;
  --r-lg: 20px;
  --r: 15px;
  --r-sm: 11px;
  --nav-h: 68px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #241A1E;
    --surface: #2E2227;
    --surface-2: #392830;
    --surface-3: #472F38;
    --line: #48333A;
    --line-2: #5C414A;
    --ink: #FBE7E2;
    --ink-soft: #D2AFB0;
    --ink-faint: #A2807F;
    --rose: #EE8AA5;
    --rose-deep: #F6A5BA;
    --rose-soft: #4A2B37;
    --apricot: #F2A170;
    --apricot-soft: #4B3026;
    --amber: #E7B75F;
    --amber-soft: #453220;
    --sage: #8FBCA4;
    --sage-soft: #2C3B34;
    --on-accent: #2A1A20;
    --shadow: 0 6px 20px rgba(0, 0, 0, 0.30);
    --shadow-lg: 0 14px 34px rgba(0, 0, 0, 0.42);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #241A1E;
  --surface: #2E2227;
  --surface-2: #392830;
  --surface-3: #472F38;
  --line: #48333A;
  --line-2: #5C414A;
  --ink: #FBE7E2;
  --ink-soft: #D2AFB0;
  --ink-faint: #A2807F;
  --rose: #EE8AA5;
  --rose-deep: #F6A5BA;
  --rose-soft: #4A2B37;
  --apricot: #F2A170;
  --apricot-soft: #4B3026;
  --amber: #E7B75F;
  --amber-soft: #453220;
  --sage: #8FBCA4;
  --sage-soft: #2C3B34;
  --on-accent: #2A1A20;
  --shadow: 0 6px 20px rgba(0, 0, 0, 0.30);
  --shadow-lg: 0 14px 34px rgba(0, 0, 0, 0.42);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; border-radius: 4px; }
::selection { background: var(--rose-soft); color: var(--ink); }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; color: var(--ink); }
h1 { font-size: 30px; line-height: 1.15; }
h2 { font-size: 23px; line-height: 1.2; }
h3 { font-size: 18px; line-height: 1.25; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-soft); }
.faint { color: var(--ink-faint); }
.small { font-size: 13.5px; }
.eyebrow { font-family: var(--display); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---- Shell ---- */
.app { max-width: 560px; margin: 0 auto; padding-inline: 18px; padding-block: 0 calc(var(--nav-h) + 34px + env(safe-area-inset-bottom)); }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; padding-block: 22px 4px; }
.hello { display: grid; gap: 1px; }
.hello .kicker { font-family: var(--display); font-size: 13px; font-weight: 600; color: var(--rose); letter-spacing: 0.02em; }
.hello h1 { font-size: 27px; }
.sync { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); flex: none; }
.sync i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-faint); display: block; }
.sync.on i { background: var(--sage); }
.sync.local i { background: var(--amber); }

.view { display: grid; gap: 20px; padding-top: 14px; }
.section { display: grid; gap: 11px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }

/* ---- Quote ---- */
.quote { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 17px 19px; display: grid; gap: 7px; box-shadow: var(--shadow); }
.quote p { font-family: var(--quote); font-style: italic; font-size: 17.5px; line-height: 1.45; color: var(--ink); }
.quote .mark { font-family: var(--quote); font-style: italic; font-size: 30px; line-height: 0.6; color: var(--rose); opacity: 0.6; }

/* ---- Week ribbon ---- */
.ribbon { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r);
  padding: 9px 2px 8px; display: grid; gap: 5px; justify-items: center; position: relative;
  min-height: 66px; align-content: start;
}
.day .l { font-family: var(--display); font-weight: 700; font-size: 13px; color: var(--ink-soft); line-height: 1; }
.day .d { width: 9px; height: 9px; border-radius: 50%; background: var(--line-2); }
.day .t { font-size: 9.5px; line-height: 1.1; text-align: center; color: var(--ink-faint); font-weight: 600; letter-spacing: 0.02em; }
.day.rose .d { background: var(--rose); }
.day.apricot .d { background: var(--apricot); }
.day.sage .d { background: var(--sage); }
.day.amber .d { background: var(--amber); }
.day.today { border-color: var(--rose); border-width: 2px; background: var(--rose-soft); padding: 8px 1px 7px; }
.day.today .l { color: var(--rose-deep); }
.day.done .d { background: var(--sage); position: relative; }
.day.done .d::after { content: ''; position: absolute; inset: 0; margin: auto; width: 4px; height: 7px; border-right: 2px solid var(--surface); border-bottom: 2px solid var(--surface); transform: translateY(-1px) rotate(40deg); }

/* ---- Cards ---- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow); }
.stack { display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }

.hero { border-radius: var(--r-xl); padding: 22px 20px; display: grid; gap: 14px; border: 0; box-shadow: var(--shadow-lg); position: relative; overflow: hidden; }
.hero.rose { background: linear-gradient(150deg, var(--rose-soft) 0%, var(--apricot-soft) 100%); }
.hero.apricot { background: linear-gradient(150deg, var(--apricot-soft) 0%, var(--amber-soft) 100%); }
.hero.sage { background: linear-gradient(150deg, var(--sage-soft) 0%, var(--apricot-soft) 100%); }
.hero.amber { background: linear-gradient(150deg, var(--amber-soft) 0%, var(--rose-soft) 100%); }
.hero h2 { font-size: 27px; }
.hero .lede { color: var(--ink-soft); font-size: 15px; }
.hero .meta { display: flex; gap: 8px; flex-wrap: wrap; }

.tag { font-family: var(--display); font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; background: var(--surface); color: var(--ink-soft); border: 1px solid var(--line); }
.tag.solid { border-color: transparent; color: var(--on-accent); }
.tag.solid.rose { background: var(--rose); }
.tag.solid.apricot { background: var(--apricot); }
.tag.solid.sage { background: var(--sage); }
.tag.solid.amber { background: var(--amber); }

/* ---- Buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 20px; border-radius: 999px;
  border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink);
  font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.01em;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.btn:hover { border-color: var(--rose); }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--rose); border-color: var(--rose); color: var(--on-accent); min-height: 54px; font-size: 17px; box-shadow: var(--shadow); }
.btn.primary:hover { background: var(--rose-deep); border-color: var(--rose-deep); }
.btn.soft { background: transparent; border-color: transparent; color: var(--rose); }
.btn.soft:hover { background: var(--rose-soft); border-color: transparent; }
.btn.sm { min-height: 38px; padding: 0 15px; font-size: 14px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: default; }

/* ---- Water ---- */
.water { display: grid; gap: 12px; }
.glasses { display: grid; grid-template-columns: repeat(8, 1fr); gap: 7px; }
.glass {
  aspect-ratio: 3 / 4; border-radius: 8px 8px 11px 11px; border: 2px solid var(--line-2);
  background: var(--surface); padding: 0; position: relative; overflow: hidden;
  transition: transform 0.14s ease;
}
.glass:active { transform: scale(0.92); }
.glass::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(180deg, var(--sage) 0%, var(--sage) 100%); opacity: 0.85; transition: height 0.25s ease; }
.glass.full { border-color: var(--sage); }
.glass.full::after { height: 78%; }
.water .lbl { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.water .amt { font-family: var(--display); font-weight: 700; font-size: 17px; color: var(--sage); }

/* ---- Stat strip ---- */
.strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 12px; display: grid; gap: 2px; text-align: center; }
.stat .v { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.05; color: var(--rose); }
.stat .k { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; line-height: 1.25; }

/* ---- Exercise preview ---- */
.preview { display: grid; gap: 0; }
.preview .i { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.preview .i:last-child { border-bottom: 0; padding-bottom: 0; }
.preview .i .n { font-weight: 600; }
.preview .i .t { color: var(--ink-soft); font-size: 13.5px; white-space: nowrap; }

/* ---- Session in progress ---- */
.wo-top { display: grid; gap: 14px; }
.bar { height: 9px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--rose), var(--apricot)); border-radius: 999px; transition: width 0.35s cubic-bezier(.4,0,.2,1); }
.cheer { font-family: var(--quote); font-style: italic; font-size: 15.5px; color: var(--rose-deep); }
.ex-list { display: grid; gap: 10px; }
.exr {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 14px 15px; display: grid; grid-template-columns: 1fr auto; gap: 10px 12px; align-items: center;
  transition: background 0.2s ease, border-color 0.2s ease;
}
.exr.done { background: var(--sage-soft); border-color: var(--sage); }
.exr .name { font-family: var(--display); font-weight: 700; font-size: 16.5px; line-height: 1.25; }
.exr.done .name { color: var(--ink-soft); }
.exr .tgt { font-size: 13.5px; color: var(--ink-soft); margin-top: 1px; }
.exr .hint { font-size: 13px; color: var(--ink-faint); font-style: italic; margin-top: 3px; }
.exr .yay { font-family: var(--quote); font-style: italic; font-size: 14px; color: var(--sage); margin-top: 3px; }
.exr .fld { grid-column: 1 / -1; display: flex; align-items: center; gap: 9px; }
.exr .fld input { width: 96px; min-height: 42px; padding: 6px 12px; border-radius: var(--r-sm); border: 1.5px solid var(--line-2); background: var(--bg); color: var(--ink); font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.exr .fld input:focus { border-color: var(--rose); outline: none; }
.exr .fld span { font-size: 13.5px; color: var(--ink-soft); }
.tick {
  width: 50px; height: 50px; border-radius: 50%; flex: none; padding: 0;
  border: 2px solid var(--line-2); background: var(--surface); color: transparent;
  display: inline-grid; place-items: center; transition: transform 0.14s ease;
}
.tick::before { content: ''; width: 15px; height: 9px; border-left: 3px solid currentColor; border-bottom: 3px solid currentColor; transform: translateY(-2px) rotate(-45deg); border-radius: 1px; }
.tick:hover { border-color: var(--sage); color: var(--sage-soft); }
.tick.on { background: var(--sage); border-color: var(--sage); color: #fff; }
.tick:active { transform: scale(0.9); }

/* ---- Week view ---- */
.plan { display: grid; gap: 10px; }
.pday { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; display: grid; gap: 9px; }
.pday.today { border-color: var(--rose); border-width: 2px; padding: 13px 15px; }
.pday .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.pday .dn { font-family: var(--display); font-weight: 700; font-size: 16px; }
.pday select { width: 100%; min-height: 46px; padding: 8px 38px 8px 14px; border-radius: var(--r); border: 1.5px solid var(--line-2); background-color: var(--bg); color: var(--ink); appearance: none; -webkit-appearance: none; font-weight: 600;
  background-image: linear-gradient(45deg, transparent 50%, var(--rose) 50%), linear-gradient(135deg, var(--rose) 50%, transparent 50%);
  background-position: calc(100% - 21px) 50%, calc(100% - 15px) 50%; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; }
.pday select:focus { border-color: var(--rose); outline: none; }

/* ---- Journal ---- */
.jlist { display: grid; gap: 10px; }
.jitem { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.jitem > button.hd { width: 100%; border: 0; background: transparent; color: inherit; text-align: left; padding: 14px 16px; display: grid; grid-template-columns: 46px 1fr auto; gap: 13px; align-items: center; }
.jitem .dt { text-align: center; }
.jitem .dt b { display: block; font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1; }
.jitem .dt small { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 700; margin-top: 2px; }
.jitem .nm { font-family: var(--display); font-weight: 700; font-size: 16px; }
.jitem .sub { font-size: 13px; color: var(--ink-soft); }
.jitem .bd { padding: 0 16px 15px; display: grid; gap: 8px; }
.jline { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.jline:last-of-type { border-bottom: 0; }
.jnote { font-family: var(--quote); font-style: italic; color: var(--ink-soft); font-size: 14.5px; }

/* ---- Mini chart ---- */
.spark { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; align-items: end; height: 88px; }
.spark .b { display: grid; gap: 6px; justify-items: center; align-content: end; height: 100%; }
.spark .b i { display: block; width: 100%; max-width: 26px; background: var(--rose); border-radius: 6px 6px 3px 3px; min-height: 3px; }
.spark .b.zero i { background: var(--line); }
.spark .b span { font-size: 11px; color: var(--ink-faint); font-weight: 700; }

/* ---- Feel picker ---- */
.feels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.feel { border: 1.5px solid var(--line-2); background: var(--surface); border-radius: var(--r); padding: 12px 8px; display: grid; gap: 3px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 14px; }
.feel small { font-size: 11.5px; font-weight: 600; color: var(--ink-faint); font-family: var(--body); }
.feel.on { background: var(--rose-soft); border-color: var(--rose); color: var(--rose-deep); }

textarea { width: 100%; min-height: 84px; padding: 12px 14px; border-radius: var(--r); border: 1.5px solid var(--line-2); background: var(--bg); color: var(--ink); resize: vertical; line-height: 1.5; font-family: var(--body); }
textarea:focus { border-color: var(--rose); outline: none; }
textarea::placeholder { color: var(--ink-faint); }

/* ---- Toast / modal ---- */
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(14px); background: var(--ink); color: var(--bg); padding: 11px 20px; border-radius: 999px; font-weight: 700; font-size: 14.5px; font-family: var(--display); opacity: 0; transition: opacity 0.22s, transform 0.22s; z-index: 60; pointer-events: none; max-width: calc(100% - 36px); text-align: center; box-shadow: var(--shadow-lg); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.modal { position: fixed; inset: 0; z-index: 70; background: rgba(60, 30, 40, 0.45); display: flex; align-items: flex-end; justify-content: center; padding: 14px; }
.modal .sheet { width: 100%; max-width: 480px; background: var(--bg); border-radius: var(--r-xl); padding: 22px 20px; display: grid; gap: 16px; max-height: calc(100vh - 28px); overflow: auto; box-shadow: var(--shadow-lg); }
@media (min-width: 560px) { .modal { align-items: center; } }

.empty { text-align: center; color: var(--ink-soft); padding: 26px 16px; border: 1.5px dashed var(--line-2); border-radius: var(--r-lg); font-size: 14.5px; }

/* ---- Bottom nav ---- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; }
.nav .in { width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; padding: 0 14px; }
.tab { border: 0; background: transparent; color: var(--ink-faint); font-family: var(--display); font-weight: 700; font-size: 14px; padding: 9px 0; border-radius: 999px; position: relative; transition: color 0.18s ease, background 0.18s ease; }
.tab.on { color: var(--rose-deep); background: var(--rose-soft); }
.tab .dot { position: absolute; top: 6px; right: 18%; width: 7px; height: 7px; border-radius: 50%; background: var(--apricot); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="hello">
      <span class="kicker" id="kicker">Good morning</span>
      <h1>Samantha</h1>
    </div>
    <div class="sync local" id="sync" title="Where your plan is saved"><i></i><span class="sr-only" id="syncLabel">Saving on this device</span></div>
  </header>
  <main>
    <section class="view" id="view-today"></section>
    <section class="view" id="view-week" hidden></section>
    <section class="view" id="view-journal" hidden></section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>
<nav class="nav" aria-label="Sections">
  <div class="in">
    <button class="tab on" data-tab="today" id="tab-today" type="button">Today</button>
    <button class="tab" data-tab="week" id="tab-week" type="button">My Week</button>
    <button class="tab" data-tab="journal" id="tab-journal" type="button">Journal</button>
  </div>
</nav>

function sessionEmail(log) {

async function sendMail(subject, body, opts) {

  const m = mailPrefs();
  if (!m.on && !opts.force) return;
  if (!m.key) { if (opts.force) toast('Add the email key in Journal → Sharing first'); return; }

    const r = await fetch('https://api.web3forms.com/submit', {
      method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({ access_key: m.key, subject, from_name: "Samantha's Training Plan", message: body }),
    });
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (r.ok && j && j.success) { if (opts.force) toast('Sent — check your inbox'); }
    else if (opts.force) toast('Could not send: ' + ((j && j.message) || ('HTTP ' + r.status)));
  } catch (e) {
    console.warn('mail failed', e);
    if (opts.force) toast('This copy cannot send email — use the downloaded file version');
  }
}

/* ================= Helpers ================= */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (k === 'value') n.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected') n[k] = !!v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    n.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  return n;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function pad2(n) { return String(n).padStart(2, '0'); }
function todayISO(d) { d = d || new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function dayKey(d) { return DAY_KEYS[(new Date(d).getDay() + 6) % 7]; }
function fmtDate(iso, o) { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', o || { weekday: 'short', day: 'numeric', month: 'short' }); }
function fmtMins(m) { m = Math.round(m || 0); if (m < 60) return `${m} min`; const h = Math.floor(m / 60); const r = m % 60; return r ? `${h}h ${r}m` : `${h}h`; }
function startOfWeek(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
/* stable daily pick so the quote does not flicker on every render */
function daily(list, salt) {
  const t = todayISO();
  let h = salt ? salt.length * 7 : 0;
  for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
  return list[h % list.length];
}
function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
function firstNum(t) { const m = String(t || '').match(/\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : null; }

/* ================= State ================= */
const S = {
  plan: Object.assign({}, DEFAULT_PLAN),
  logs: {},          // id -> completed session
  water: {},         // 'YYYY-MM-DD' -> glasses
  weights: {},       // exercise id -> last kg used
  active: null,
  tab: 'today',
  expanded: {},
  mail: null,
  updatedAt: 0,
};
const LS_KEY = 'samantha.plan.v1';
const Store = {
  db: null,
  loadLocal() {
    try { const raw = localStorage.getItem(LS_KEY); if (!raw) return; const d = JSON.parse(raw);
      if (d.plan) S.plan = Object.assign({}, DEFAULT_PLAN, d.plan);
      S.logs = d.logs || {}; S.water = d.water || {}; S.weights = d.weights || {}; S.active = d.active || null; S.mail = d.mail || null; S.updatedAt = d.updatedAt || 0;
    } catch (e) {}
  },
  saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ plan: S.plan, logs: S.logs, water: S.water, weights: S.weights, active: S.active, mail: S.mail, updatedAt: S.updatedAt })); } catch (e) {}
  },
  async remote(fn) {
    if (!this.db) return;
    try { await fn(this.db); }
    catch (e) {
      if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 500)); try { await fn(this.db); } catch (e2) { console.warn('save failed', e2); } }
      else if (e && e.code === 'quota_exceeded') toast('Storage is full — delete a few old journal entries');
      else console.warn('save failed', e);
    }
  },
  putLog(l) { S.logs[l.id] = l; this.saveLocal(); this.remote(db => db.doc('sessions/' + l.id).set(l)); },
  delLog(id) { delete S.logs[id]; this.saveLocal(); this.remote(db => db.doc('sessions/' + id).delete()); },
  putMeta() { S.updatedAt = Date.now(); this.saveLocal(); const b = { plan: clone(S.plan), water: clone(S.water), weights: clone(S.weights), mail: S.mail ? clone(S.mail) : null, updatedAt: S.updatedAt }; this.remote(db => db.doc('meta/settings').set(b)); },
  _t: null,
  putActive(now) {
    if (S.active) S.active.updatedAt = Date.now();
    this.saveLocal();
    clearTimeout(this._t);
    const w = () => { const b = { active: S.active ? clone(S.active) : null, updatedAt: Date.now() }; this.remote(db => db.doc('meta/active').set(b)); };
    if (now) w(); else this._t = setTimeout(w, 700);
  },
  async connect() {
    if (!(window.claude && typeof window.claude.use === 'function')) return false;
    let db = null;
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
    if (!db) return false;
    this.db = db;
    try {
      const [logSnap, metaSnap, actSnap] = await Promise.all([
        db.collection('sessions').orderBy('finishedAt', 'desc').limit(500).get(),
        db.doc('meta/settings').get(),
        db.doc('meta/active').get(),
      ]);
      const remote = {}; logSnap.docs.forEach(d => { if (d.exists) remote[d.id] = d.data(); });
      for (const [id, l] of Object.entries(S.logs)) if (!remote[id]) await this.remote(db => db.doc('sessions/' + id).set(l));
      Object.assign(S.logs, remote);
      if (metaSnap.exists) {
        const m = metaSnap.data();
        if ((m.updatedAt || 0) >= (S.updatedAt || 0)) {
          if (m.plan) S.plan = Object.assign({}, DEFAULT_PLAN, m.plan);
          S.water = Object.assign({}, S.water, m.water || {});
          S.weights = Object.assign({}, S.weights, m.weights || {});
          if (m.mail) S.mail = m.mail;
          S.updatedAt = m.updatedAt || 0;
        } else this.putMeta();
      } else if (S.updatedAt) this.putMeta();
      if (actSnap.exists) {
        const r = actSnap.data();
        const localTs = S.active ? (S.active.updatedAt || 0) : 0;
        if ((r.updatedAt || 0) > localTs) S.active = r.active || null; else if (S.active) this.putActive(true);
      } else if (S.active) this.putActive(true);
      this.saveLocal();
      this.subscribe(db);
      return true;
    } catch (e) { console.warn('connect failed', e); return false; }
  },
  subscribe(db) {
    const busy = () => S.tab === 'today' && S.active;
    db.collection('sessions').onSnapshot(snap => {
      let ch = false;
      snap.docChanges().forEach(c => {
        if (c.type === 'removed') { if (S.logs[c.doc.id]) { delete S.logs[c.doc.id]; ch = true; } }
        else { const d = c.doc.data(); if (JSON.stringify(S.logs[c.doc.id]) !== JSON.stringify(d)) { S.logs[c.doc.id] = d; ch = true; } }
      });
      if (ch) { this.saveLocal(); if (!busy()) render(); }
    }, e => console.warn('sessions watch ended', e));
    db.doc('meta/settings').onSnapshot(s => {
      if (!s.exists) return;
      const m = s.data();
      if ((m.updatedAt || 0) > (S.updatedAt || 0)) {
        if (m.plan) S.plan = Object.assign({}, DEFAULT_PLAN, m.plan);
        S.water = Object.assign({}, S.water, m.water || {});
        S.weights = Object.assign({}, S.weights, m.weights || {});
        if (m.mail) S.mail = m.mail;
        S.updatedAt = m.updatedAt;
        this.saveLocal(); if (!busy()) render();
      }
    }, e => console.warn('settings watch ended', e));
  },
};

/* ================= Derived ================= */
function sessionById(id) { return SESSIONS.find(s => s.id === id) || null; }
function logsSorted() { return Object.values(S.logs).filter(Boolean).sort((a, b) => (b.finishedAt || '').localeCompare(a.finishedAt || '')); }
function logsOn(iso) { return logsSorted().filter(l => l.date === iso); }
function plannedFor(iso) { return sessionById(S.plan[dayKey(iso)]) || sessionById('rest'); }
function waterToday() { return S.water[todayISO()] || 0; }
function weekDates() {
  const s = startOfWeek(new Date());
  return DAY_KEYS.map((_, i) => { const d = new Date(s); d.setDate(d.getDate() + i); return todayISO(d); });
}
function weekStats() {
  const dates = weekDates();
  const logs = logsSorted();
  const inWeek = logs.filter(l => dates.includes(l.date));
  const mins = inWeek.reduce((a, l) => a + (l.mins || 0), 0);
  const planned = DAY_KEYS.filter(k => S.plan[k] !== 'rest').length;
  /* day streak: consecutive days back from today with a session or a planned rest day honoured */
  let streak = 0;
  for (let i = 0; i < 400; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const iso = todayISO(d);
    const did = logsOn(iso).length > 0;
    const isRest = S.plan[dayKey(iso)] === 'rest';
    if (did || isRest) { if (!(i === 0 && !did && !isRest)) streak++; }
    else if (i === 0) continue;
    else break;
  }
  return { done: inWeek.length, planned, mins, streak, total: logs.length };
}
function monthCount() {
  const now = new Date();
  return logsSorted().filter(l => { const d = new Date(l.finishedAt); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); }).length;
}
function greeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 18) return 'Good afternoon';
  return 'Good evening';
}

/* ================= Toast / modal ================= */
let tT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('show'), 2400); }
function openModal(content) {
  const root = $('#modalRoot'); root.innerHTML = '';
  const sheet = el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true' }, content);
  const wrap = el('div', { class: 'modal', onclick: e => { if (e.target === wrap) closeModal(); } }, sheet);
  root.appendChild(wrap); document.body.style.overflow = 'hidden';
  return sheet;
}
function closeModal() { $('#modalRoot').innerHTML = ''; document.body.style.overflow = ''; }

/* ================= Render ================= */
function render() {
  ['today', 'week', 'journal'].forEach(t => {
    $('#view-' + t).hidden = S.tab !== t;
    $('#tab-' + t).classList.toggle('on', S.tab === t);
  });
  const dot = $('#tab-today .dot');
  if (S.active && !dot) $('#tab-today').appendChild(el('span', { class: 'dot', 'aria-hidden': 'true' }));
  if (!S.active && dot) dot.remove();
  $('#kicker').textContent = greeting();
  const sy = $('#sync'); sy.classList.toggle('on', !!Store.db); sy.classList.toggle('local', !Store.db);

  if (d.plan) S.plan = Object.assign({}, DEFAULT_PLAN, d.plan);
  S.water = Object.assign({}, d.water || {}, S.water);
  S.weights = Object.assign({}, d.weights || {}, S.weights);
  if (d.mail) S.mail = d.mail;
  Store.putMeta();
  toast(n ? `Restored ${n} session${n === 1 ? '' : 's'}` : 'Plan restored');
  render();
}

/* ================= Boot ================= */
function start() {
  Store.loadLocal();
  $$('.tab').forEach(b => b.addEventListener('click', () => { S.tab = b.dataset.tab; render(); window.scrollTo({ top: 0 }); }));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modalRoot').children.length) closeModal(); });
  render();
  Store.connect().then(ok => { if (ok) render(); });
}
if (window.claude && window.claude.hot && typeof window.claude.hot.ready === 'function') window.claude.hot.ready(start); else start();
</script>
</body>
